<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuahQT - 루아큐티</title>

  <!-- ── 1. React & ReactDOM CDN ── -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- ── 2. Babel (브라우저 내 JSX 실시간 변환기) ── -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- ── 3. Firebase SDK v9 Compatibility (CDN 스크립트 버전) ── -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    /* 스크롤바 정돈 및 기본 리셋 */
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
    }

    /* ── 구글시트 마크(형광펜) 태그 컬러 원본 유지 스타일 ── */
    mark {
      background-color: rgba(250, 204, 21, 0.28); /* 기본 노란색 */
      color: inherit;
      padding: 0 4px;
      border-radius: 3px;
    }
    mark.hl-yellow { background-color: rgba(250, 204, 21, 0.35); }
    mark.hl-orange { background-color: rgba(249, 115, 22, 0.25); }
    mark.hl-red    { background-color: rgba(239, 68, 68, 0.25); }
    mark.hl-green  { background-color: rgba(34, 197, 94, 0.25); }
    mark.hl-blue   { background-color: rgba(59, 130, 246, 0.25); }
    mark.hl-purple { background-color: rgba(168, 85, 247, 0.25); }
    mark.hl-pink   { background-color: rgba(236, 72, 153, 0.25); }
    mark.hl-gray   { background-color: rgba(161, 161, 170, 0.25); }
  </style>
</head>
<body>

  <!-- React 앱이 마운트될 루트 엘리먼트 -->
  <div id="root"></div>

  <!-- type="text/babel" 설정을 통해 Babel이 자바스크립트를 JSX로 실시간 변환하게 합니다 -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ── 디자인 토큰 정의 ── */
    const C = {
      bgPage:   "#FFFFFF",
      headerBg: "#121212",
      text:     "#18181B",
      textSub:  "#52525B",
      textMute: "#A1A1AA",
      border:   "#E5E7EB",
    };

    const processHTML = (text) => {
      if (!text) return "";
      return String(text); // 태그 데이터를 훼손하지 않고 원본 그대로 넘깁니다.
    };

    /* ── Section Component ── */
    const Section = ({ label, icon, children }) => (
      <section style={{ marginBottom: "48px" }}>
        <h2 style={{ fontSize: "18px", fontWeight: "700", color: C.text, marginBottom: "20px", display: "flex", alignItems: "center", gap: "8px", borderBottom: `1px solid ${C.border}`, paddingBottom: "12px", fontFamily: "sans-serif" }}>
          <span style={{ fontSize: "20px" }}>{icon}</span><span>{label}</span>
        </h2>
        <div>{children}</div>
      </section>
    );

    const serif = "'Nanum Myeongjo', 'Apple Myungjo', 'Batang', Georgia, serif";
    let hasCountedVisit = false;

    /* ── Firebase 초기화 로직 ── */
    let app, auth, db, appId;
    try {
      if (typeof __firebase_config !== 'undefined') {
        const firebaseConfig = JSON.parse(__firebase_config);
        app = firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();
        appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
      }
    } catch (e) {
      console.warn("Firebase Config가 없습니다. 오프라인 모드로 실행합니다.", e);
    }

    /* ── 날짜 포맷 변환 헬퍼 ── */
    const formatDateToDot = (str) => {
      if (!str) return "";
      if (typeof str === 'string' && str.match(/^\d{4}-\d{2}-\d{2}$/)) {
        return str.replace(/-/g, '.');
      }
      return str;
    };

    /* ── 메인 App 컴포넌트 ── */
    function App() {
      const [qtData, setQtData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [fontScale, setFontScale] = useState(1.0);
      const [isScrolled, setIsScrolled] = useState(false);
      
      const [user, setUser] = useState(null);
      const [visitors, setVisitors] = useState({ today: 0, total: 0 });
      const [toast, setToast] = useState({ show: false, message: "" });

      const handleZoomIn = () => setFontScale(prev => Math.min(prev + 0.15, 1.6));
      const handleZoomOut = () => setFontScale(prev => Math.max(prev - 0.15, 0.8));

      const showToastMessage = (message) => {
        setToast({ show: true, message });
        setTimeout(() => setToast({ show: false, message: "" }), 2500);
      };

      const copyToClipboard = (text, successMsg) => {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed"; 
        textarea.style.top = "0";
        textarea.style.left = "0";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          document.execCommand('copy');
          showToastMessage(successMsg);
        } catch (err) {
          showToastMessage("복사에 실패했습니다. 직접 복사해주세요.");
        }
        document.body.removeChild(textarea);
      };

      /* ── Firebase Auth & 방문자 카운터 ── */
      useEffect(() => {
        if (!auth) return;
        
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await auth.signInWithCustomToken(__initial_auth_token);
            } else {
              await auth.signInAnonymously();
            }
          } catch (e) { console.error("Auth Error", e); }
        };
        initAuth();
        return auth.onAuthStateChanged(setUser);
      }, []);

      useEffect(() => {
        if (!user || !db || !appId || hasCountedVisit) return;
        hasCountedVisit = true;

        const recordVisit = async () => {
          try {
            const docRef = db.doc(`artifacts/${appId}/public/data/viewStats/counter`);
            const snap = await docRef.get();
            
            const todayStr = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' })
                             .format(new Date()).replace(/(\. |\.)/g, '-').replace(/-$/, '');

            let newTotal = 1, newToday = 1;
            if (snap.exists) {
              const data = snap.data();
              newTotal = (data.total || 0) + 1;
              newToday = data.todayDate === todayStr ? (data.today || 0) + 1 : 1;
            }

            await docRef.set({ total: newTotal, today: newToday, todayDate: todayStr });
            setVisitors({ today: newToday, total: newTotal });
          } catch (e) { console.error("Visitor Count Error:", e); }
        };
        recordVisit();
      }, [user]);

      /* ── 스크롤 감지 및 구글 시트 데이터 로드 ── */
      useEffect(() => {
        const onScroll = () => setIsScrolled(window.scrollY > 150);
        window.addEventListener("scroll", onScroll);

        const link = document.createElement("link");
        link.rel = "stylesheet"; 
        link.href = "https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap";
        document.head.appendChild(link);

        const SHEET_ID = "1dH5npAo-c2wnhBRvt50aWKsM5q8lxhcLU7-R37c8_RU";
        fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`)
          .then(res => res.text())
          .then(text => {
            const data = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
            let cols = data.table.cols.map(c => c?.label?.replace(/\s+/g, '') || "");
            let rows = data.table.rows;
            
            if (!cols.some(c => c !== "") && rows.length > 0) {
              cols = rows[0].c.map(cell => cell?.v ? String(cell.v).replace(/\s+/g, '') : "");
              rows = rows.slice(1);
            }
            
            if (rows.length === 0) throw new Error("시트가 비어있습니다.");

            const parsedRows = rows.map(r => {
              const obj = {};
              cols.forEach((colName, idx) => {
                if (!colName) return;
                let val = r.c[idx] ? (r.c[idx].f || r.c[idx].v || "") : "";
                
                if (typeof val === 'string') {
                  if (val.startsWith('Date(')) {
                    const m = val.match(/Date\((\d+),\s*(\d+),\s*(\d+)/);
                    if (m) val = `${m[1]}-${String(parseInt(m[2]) + 1).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
                  } else if (val.match(/^\d{4}\.\s*\d{1,2}\.\s*\d{1,2}\.?$/)) {
                    val = val.replace(/\s/g, '').replace(/\.$/, '').split('.').map((n, i) => i > 0 ? n.padStart(2, '0') : n).join('-');
                  }
                }
                obj[colName] = val;
              });
              return obj;
            }).filter(r => r["날짜"] || r["Date"] || r["본문내용"]);

            const todayStr = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' })
                             .format(new Date()).replace(/(\. |\.)/g, '-').replace(/-$/, '');
            
            let selectedRow = parsedRows.find(r => (r["날짜"] || r["Date"]) === todayStr);
            if (!selectedRow) {
              const pastRows = parsedRows.filter(r => (r["날짜"] || r["Date"]) < todayStr)
                                         .sort((a, b) => (b["날짜"] || b["Date"]).localeCompare(a["날짜"] || a["Date"]));
              selectedRow = pastRows.length > 0 ? pastRows[0] : parsedRows[parsedRows.length - 1];
            }
            
            setQtData(selectedRow);
            setLoading(false);
          })
          .catch(err => {
            console.error(err);
            setError("데이터를 불러오지 못했습니다.");
            setLoading(false);
          });

        return () => { 
          window.removeEventListener("scroll", onScroll); 
          try { document.head.removeChild(link); } catch(e){} 
        };
      }, []);

      /* ── [개선 완료] 이미지와 완벽하게 일치하는 로딩 화면 적용 ── */
      if (loading) {
        return (
          <div style={{ background: C.bgPage, height: "100vh", display: "flex", justifyContent: "center", alignItems: "center" }}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "20px" }}>
              <div style={{
                width: "82px",
                height: "82px",
                borderRadius: "50%",
                backgroundColor: "#F8F6F2", // 이미지의 부드러운 베이지 배경색
                display: "flex",
                justifyContent: "center",
                alignItems: "center"
              }}>
                <svg style={{ transform: "scaleX(-1)" }} viewBox="0 0 512 512" width="38" height="38" fill="#B9A58E">
                  <path d="M502.5 137.3l-13.8 29.5c-13.6 29-45 44-77 36l-85.3-21c-22.3-5.5-45.7 4-57.8 23.5L258 223.5c-20 32-52.6 51.5-90.5 52.5L22.8 281.3C9 281.8-.8 294.6 1.4 308.2c4.7 28.5 21.6 53 47.3 68.3l12.4 7.4c13.8 8.2 31.4 6 43.6-5.5l14-13.5c15.2-14.7 38.3-15.6 54-2l21.2 18.5c14.7 12.8 36.3 13.8 52 2.4l19.5-14.2c16-11.7 38-11.4 53.2 1l25 21.2c15.7 13.3 39 12.7 53.6-1.5l11-10.7c17.6-17.2 45.4-18 63.8-1.8l10.4 9.2c14.6 12.8 36.6 12.2 50.4-1.4l16.7-16.5c17.5-17.3 19.3-45 4-63.5L463 268.5c-13-16-17-37-10.6-56l22.4-66c6.2-18.4-4-38.5-21.7-44.4-18.2-6-38 3.5-44.5 21.4zM245.5 145c11.3 0 20.5-9.2 20.5-20.5S256.8 104 245.5 104 225 113.2 225 124.5s9.2 20.5 20.5 20.5z" />
                </svg>
              </div>
              <div style={{ fontFamily: "'Noto Sans KR', sans-serif", fontSize: "16px", color: "#8E8E93", fontWeight: "600", letterSpacing: "0.5px" }}>
                루아큐티 준비 중...
              </div>
            </div>
          </div>
        );
      }

      const getVal = (keys, fallback = "") => {
        if (!qtData) return fallback;
        const foundKey = keys.find(k => qtData[k] !== undefined && qtData[k] !== null && qtData[k] !== "");
        return foundKey ? String(qtData[foundKey]) : fallback;
      };

      const dateStr = getVal(["날짜", "Date"], "");
      const refStr = getVal(["본문주소", "주소", "Reference"], "오늘의 말씀");
      const titleStr = getVal(["제목", "주제", "묵상제목", "Title"], "");
      const versesText = getVal(["본문내용", "말씀본문", "본문"], "");
      const medText = getVal(["말씀묵상", "묵상"], "");
      const prayerText = getVal(["기도", "오늘의기도"], "");

      /* ── 콤마(,) 기준 다중 본문주소 분리 및 정교한 그룹화 가공 ── */
      const refList = refStr ? refStr.split(',').map(r => r.trim()).filter(Boolean) : [];
      
      const parsedRefs = [];
      let currentBook = "";
      refList.forEach(ref => {
        const match = ref.match(/^([1-3]?\s*[가-힣]+)\s+(.*)$/);
        if (match) {
          currentBook = match[1].trim();
          const range = match[2].trim();
          parsedRefs.push({ book: currentBook, range: range });
        } else {
          parsedRefs.push({ book: currentBook || "성경", range: ref });
        }
      });

      const groupedRefs = [];
      parsedRefs.forEach(ref => {
        const existing = groupedRefs.find(g => g.book === ref.book);
        if (existing) {
          existing.ranges.push(ref.range);
        } else {
          groupedRefs.push({ book: ref.book, ranges: [ref.range] });
        }
      });

      const formattedGroupedRefs = groupedRefs.map(g => `${g.book} ${g.ranges.join(', ')}`);
      const refTextDot = formattedGroupedRefs.join(' · ');   
      const refTextComma = formattedGroupedRefs.join(', '); 

      const baseFontSize = Math.round(18 * fontScale);   
      const verseFontSize = Math.round(18 * fontScale);  

      const verseNumSize = 12;   
      
      const dynBodyStyle = { margin: `0 0 ${20 * fontScale}px`, lineHeight: "2", fontSize: `${baseFontSize}px` };
      const dynVerseStyle = { margin: "0 0 18px", lineHeight: "2", fontSize: `${verseFontSize}px` };
      const zoomBtnStyle = { background: "transparent", border: "1px solid rgba(255,255,255,0.2)", color: "#FFFFFF", width: "36px", height: "32px", borderRadius: "6px", display: "flex", justifyContent: "center", alignItems: "center", fontSize: "14px", cursor: "pointer", fontFamily: "sans-serif" };

      const handleShareLink = () => {
        copyToClipboard(window.location.href, "🔗 큐티 공유 링크가 복사되었습니다!");
      };

      const handleShareText = () => {
        const cleanVerses = versesText 
          ? versesText.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]*>/g, '').split('\n').map(line => line.trim()).filter(Boolean).join('\n')
          : "";
        const cleanMed = medText 
          ? medText.replace(/<[^>]*>/g, '').split('\n').map(line => line.trim()).filter(Boolean).join('\n\n')
          : "";
        const cleanPrayer = prayerText 
          ? prayerText.replace(/<[^>]*>/g, '').split('\n').map(line => line.trim()).filter(Boolean).join('\n\n')
          : "";

        const fullShareText = `[루아큐티 · ${formatDateToDot(dateStr)}]
${titleStr ? `${titleStr} (${refTextComma})` : refTextComma}

■ 본문 내용
${cleanVerses}

■ 말씀 묵상
${cleanMed}

■ 오늘의 기도
${cleanPrayer}

* 은혜로운 말씀과 묵상, 루아큐티와 늘 동행하세요.`;

        copyToClipboard(fullShareText, "📝 전체 묵상 텍스트가 복사되었습니다!");
      };

      const formatText = (text) => {
        if (!text) return null;
        return String(text).split('\n').map((line, idx, arr) => {
          const trimmed = line.trim();
          if (!trimmed) return <div key={idx} style={{ height: '12px' }} />;

          const isLast = idx === arr.length - 1;
          let isSubtitle = false;
          let content = trimmed;

          content = content.replace(/❝\s*(.*?)\s*❞/g, '◼︎ $1');

          // HTML 태그를 무시한 순수 텍스트를 추출하여 기호를 감지합니다.
          const plainText = content.replace(/<[^>]*>/g, '').trim();

          const subSymbols = ['■', '◼', '◼︎', '▪', '❝', '▶', '✔', '✅', '✦', '★'];
          const startsWithSymbol = subSymbols.some(symbol => plainText.startsWith(symbol));

          if (startsWithSymbol) {
            isSubtitle = true;
          } else if (plainText.startsWith('# ')) {
            isSubtitle = true;
            content = content.replace(/#\s*/, '');
          } else if (plainText.match(/^\[(.*)\]$/)) {
            isSubtitle = true;
          }

          if (isSubtitle) {
            const subStyle = {
              margin: idx === 0 ? `0 0 ${8 * fontScale}px` : `${24 * fontScale}px 0 ${10 * fontScale}px`,
              fontSize: "16px",
              fontWeight: "800",
              letterSpacing: "-0.8px",
              lineHeight: "1.6"
            };
            const mStyle = isLast ? { ...subStyle, marginBottom: 0 } : subStyle;
            return <div key={idx} style={mStyle} dangerouslySetInnerHTML={{ __html: processHTML(content) }} />;
          }

          const mStyle = isLast ? { ...dynBodyStyle, margin: 0 } : dynBodyStyle;
          return <p key={idx} style={mStyle} dangerouslySetInnerHTML={{ __html: processHTML(trimmed) }} />;
        });
      };

      /* ── [개선 완료] 성경 본문 내어쓰기(Hanging Indent) 레이아웃 적용 ── */
      const formatVerses = (text) => {
        if (!text) return <p style={{ color: C.textMute }}>본문 내용이 없습니다.</p>;

        const lines = String(text).replace(/<br\s*\/?>/gi, '\n').split('\n').filter(l => l.trim());

        return (
          <div>
            {lines.map((line, idx) => {
              let currentVerse = "";
              let content = line;

              const complexMatch = line.match(/^\s*(\d+)\s*[:장]\s*(\d+)[절:.\s\|]*(.*)$/);
              const simpleMatch = line.match(/^\s*(\d+)[절:.\s\|]+(.*)$/);

              if (complexMatch) {
                currentVerse = complexMatch[2];
                content = complexMatch[3];
              } else if (simpleMatch) {
                currentVerse = simpleMatch[1];
                content = simpleMatch[2];
              }

              if (currentVerse) {
                return (
                  <div key={idx} style={{ ...dynVerseStyle, display: "flex", alignItems: "flex-start" }}>
                    {/* 절 번호 고정 영역 (숫자만 좌측에 고정시켜 본문 텍스트 내어쓰기를 구현합니다) */}
                    <div style={{
                      fontWeight: "800",
                      color: "#71717A",
                      fontFamily: "sans-serif",
                      fontSize: `${verseNumSize}px`,
                      width: "28px",         // 번호가 들어갈 고정 공간 확보
                      flexShrink: 0,         // 공간 찌그러짐 방지
                      textAlign: "left",
                      marginTop: "5px"       // 본문 18px 폰트의 기준선과 시각적으로 정렬
                    }}>
                      {currentVerse}
                    </div>
                    {/* 우측 말씀 본문 영역 */}
                    <div style={{ flex: 1 }} dangerouslySetInnerHTML={{ __html: processHTML(content) }} />
                  </div>
                );
              }

              // 절 번호가 없는 일반 라인일 경우
              return (
                <div key={idx} style={dynVerseStyle} dangerouslySetInnerHTML={{ __html: processHTML(content) }} />
              );
            })}
          </div>
        );
      };

      const shareBtnStyle = {
        flex: 1,
        background: "#F4F4F5",
        border: "1px solid #E4E4E7",
        color: C.text,
        padding: "14px 16px",
        borderRadius: "10px",
        fontSize: "14px",
        fontWeight: "700",
        cursor: "pointer",
        display: "flex",
        justifyContent: "center",
        alignItems: "center",
        gap: "8px",
        fontFamily: "sans-serif",
        transition: "all 0.2s ease",
      };

      return (
        <div style={{ background: C.bgPage, minHeight: "100vh", color: C.text, fontFamily: serif }}>
          {error && <div style={{ background: "#FEF2F2", color: "#991B1B", padding: "10px", fontSize: "13px", textAlign: "center", fontFamily: "sans-serif", borderBottom: "1px solid #FCA5A5" }}>⚠️ {error}</div>}

          <header style={{ 
            position: "fixed", 
            top: 0, 
            left: 0,
            right: 0,
            zIndex: 100, 
            background: "linear-gradient(to right, #002337, #121212)", 
            borderBottom: "1px solid #27272A", 
            boxShadow: "0 4px 12px rgba(0,0,0,0.15)", 
            height: "76px",
            transform: isScrolled ? "translateY(0)" : "translateY(-100%)",
            opacity: isScrolled ? 1 : 0,
            transition: "transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease",
            pointerEvents: isScrolled ? "auto" : "none",
            overflow: "hidden"
          }}>
            <div style={{ 
              maxWidth: "800px", 
              margin: "0 auto", 
              height: "100%",
              padding: "0 24px",
              display: "flex", 
              justifyContent: "space-between", 
              alignItems: "center" 
            }}>
              <div style={{ display: "flex", flexDirection: "column", gap: "2px" }}>
                <span style={{ fontSize: "18px", fontWeight: "800", color: "#FFFFFF", letterSpacing: "-0.5px", lineHeight: "1.2" }}>{titleStr || refTextDot}</span>
                <span style={{ fontFamily: "sans-serif", fontSize: "11px", fontWeight: "400", color: "#A1A1AA", letterSpacing: "0.5px" }}>
                  {titleStr ? `${refTextDot} · ${formatDateToDot(dateStr)}` : formatDateToDot(dateStr)}
                </span>
              </div>
              <div style={{ display: "flex", gap: "8px" }}>
                <button onClick={handleShareLink} style={zoomBtnStyle} title="링크 공유">🔗</button>
                <button onClick={handleZoomOut} style={zoomBtnStyle}>A-</button>
                <button onClick={handleZoomIn} style={zoomBtnStyle}>A+</button>
              </div>
            </div>
          </header>

          <div style={{ 
            background: "linear-gradient(to right, #002337, #121212)", 
            padding: "40px 24px 48px" 
          }}>
            <div style={{ maxWidth: "800px", margin: "0 auto" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "32px" }}>
                <div style={{ display: "flex", alignItems: "baseline", gap: "10px" }}>
                  <h1 style={{ margin: 0, fontFamily: "'DM Serif Display', serif", fontSize: "28px", color: "#FFFFFF", fontWeight: "400" }}>RuahQT</h1>
                  <span style={{ fontFamily: "sans-serif", fontSize: "12px", color: "#A1A1AA", letterSpacing: "1px" }}>루아큐티</span>
                </div>
                <div style={{ display: "flex", gap: "8px" }}>
                  <button onClick={handleShareLink} style={zoomBtnStyle} title="링크 공유">🔗</button>
                  <button onClick={handleZoomOut} style={zoomBtnStyle}>A-</button>
                  <button onClick={handleZoomIn} style={zoomBtnStyle}>A+</button>
                </div>
              </div>
              
              <div style={{ width: "100%", height: "1px", background: "rgba(255,255,255,0.15)", marginBottom: "24px" }} />
              
              <div style={{ display: "flex", flexDirection: "column", gap: "14px" }}>
                <div style={{ fontFamily: "sans-serif", fontSize: "15px", fontWeight: "400", color: "#A1A1AA", letterSpacing: "1px" }}>
                  {formatDateToDot(dateStr)}
                </div>
                
                <div style={{ fontSize: "36px", fontWeight: "800", color: "#FFFFFF", lineHeight: "1.25", letterSpacing: "-1px" }}>
                  {titleStr || refTextDot}
                </div>
                
                {titleStr && groupedRefs.length > 0 && (
                  <div style={{ marginTop: "6px", display: "flex", flexWrap: "wrap", gap: "8px" }}>
                    {groupedRefs.map((group, idx) => (
                      <div key={idx} style={{ 
                        display: "inline-block", 
                        border: "1px solid rgba(255,255,255,0.25)", 
                        borderRadius: "9999px", 
                        padding: "6px 16px", 
                        fontSize: "13px", 
                        color: "#E4E4E7",
                        fontFamily: "sans-serif",
                        letterSpacing: "0.5px"
                      }}>
                        {group.book} {group.ranges.join(', ')}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>

          <main style={{ maxWidth: "800px", margin: "0 auto", padding: "48px 24px 80px" }}>
            {versesText && <Section label="본문 내용" icon="📖">{formatVerses(versesText)}</Section>}
            {medText && <Section label="말씀 묵상" icon="📝">{formatText(medText)}</Section>}
            {prayerText && (
              <Section label="오늘의 기도" icon="🙏">
                <div style={{ background: "#FAFAFA", padding: "32px 32px 40px", borderRadius: "12px", borderLeft: "4px solid #D1D1D6" }}>
                  {String(prayerText).split('\n').filter(l => l.trim()).map((line, idx) => (
                    <p key={idx} style={{ margin: `0 0 ${20 * fontScale}px`, fontSize: `${baseFontSize}px`, lineHeight: "2" }} dangerouslySetInnerHTML={{ __html: processHTML(line) }} />
                  ))}
                </div>
              </Section>
            )}

            <div style={{ marginTop: "16px", display: "flex", gap: "12px", flexWrap: "wrap", paddingBottom: "12px" }}>
              <button onClick={handleShareText} style={shareBtnStyle}>📝 전체 텍스트 복사</button>
              <button onClick={handleShareLink} style={shareBtnStyle}>🔗 링크 복사</button>
            </div>
          </main>

          <footer style={{ background: "#FAFAFA", borderTop: `1px solid ${C.border}` }}>
            <div style={{ maxWidth: "800px", margin: "0 auto", padding: "40px 24px" }}>
              <p style={{ fontFamily: "sans-serif", fontSize: "12px", color: C.textMute, lineHeight: "2", margin: 0 }}>
                <strong style={{ color: C.textSub, display: "block", marginBottom: "8px", fontWeight: "600", letterSpacing: "1px" }}>본문 출처</strong>
                {refTextDot} · 개역개정판 © 대한성서공회 허가 사용
              </p>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: "24px", flexWrap: "wrap", gap: "10px" }}>
                <div style={{ display: "flex", alignItems: "baseline", gap: "8px" }}>
                  <span style={{ fontFamily: "'DM Serif Display', serif", fontSize: "16px", color: C.textMute }}>RuahQT</span>
                  <span style={{ fontFamily: "sans-serif", fontSize: "11px", color: "#A1A1AA", letterSpacing: "1px" }}>루아큐티</span>
                </div>
                {visitors.total > 0 && (
                  <div style={{ fontFamily: "sans-serif", fontSize: "11px", color: C.textMute, background: "#F4F4F5", padding: "4px 10px", borderRadius: "4px" }}>
                    오늘 <span style={{ fontWeight: "700", color: C.textSub }}>{visitors.today}</span> / 
                    전체 <span style={{ fontWeight: "700", color: C.textSub }}>{visitors.total}</span>
                  </div>
                )}
              </div>
            </div>
          </footer>

          {toast.show && (
            <div style={{
              position: "fixed",
              bottom: "32px",
              left: "50%",
              transform: "translateX(-50%)",
              background: "#18181B",
              color: "#FFFFFF",
              padding: "12px 24px",
              borderRadius: "30px",
              fontSize: "14px",
              fontWeight: "600",
              fontFamily: "sans-serif",
              boxShadow: "0 10px 25px rgba(0,0,0,0.25)",
              zIndex: 9999,
              whiteSpace: "nowrap",
              transition: "opacity 0.2s ease",
            }}>
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
