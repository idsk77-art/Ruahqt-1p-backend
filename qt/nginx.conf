# ══════════════════════════════════════════════════════════════
#  RuahQT — Nginx 설정  v2.1
#
#  서버 디렉터리 구조:
#    /var/www/qt/              ← 프로젝트 루트 (이 폴더 자체가 qt/)
#    /var/www/qt/index.html    ← 매일 자동 생성되는 시작 파일
#    /var/www/qt/generate.js
#    /var/www/qt/lib/
#    /var/www/qt/templates/
#
#  접속 URL:
#    http://도메인/qt/         → index.html 자동 서빙
#
#  설치:
#    sudo cp nginx.conf /etc/nginx/sites-available/ruahqt
#    sudo ln -s /etc/nginx/sites-available/ruahqt \
#               /etc/nginx/sites-enabled/ruahqt
#    sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;

    # 도메인이 있으면 _ 를 실제 도메인으로 교체
    server_name _;

    # ─────────────────────────────────────────────
    #  /qt/  →  /var/www/qt/index.html
    # ─────────────────────────────────────────────
    location /qt/ {
        # 프로젝트 루트 자체가 qt/ 폴더
        alias /var/www/qt/;

        # /qt/ 접속 시 index.html 자동 서빙
        index  index.html;
        try_files $uri $uri/ /qt/index.html;

        # 하루 한 번 갱신 → 1시간 캐시
        expires 1h;
        add_header Cache-Control "public, max-age=3600";

        gzip on;
        gzip_types text/html text/css;
    }

    # ─────────────────────────────────────────────
    #  소스 파일 직접 접근 차단
    # ─────────────────────────────────────────────
    location ~* \.(js|mjs|json|ejs|env)$ {
        deny all;
        return 404;
    }
    location /qt/lib/       { deny all; return 404; }
    location /qt/templates/ { deny all; return 404; }
    location /qt/node_modules/ { deny all; return 404; }

    error_page 404 /qt/index.html;
}
