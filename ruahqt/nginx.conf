# ══════════════════════════════════════════════════════════════
#  RuahQT — Nginx 설정
#  파일 위치: /etc/nginx/sites-available/ruahqt
#  활성화:   sudo ln -s /etc/nginx/sites-available/ruahqt \
#                        /etc/nginx/sites-enabled/ruahqt
#            sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;

    # ① 도메인을 사용하는 경우 아래 줄의 example.com 을 실제 도메인으로 교체
    # server_name example.com www.example.com;

    # ② IP 직접 접속 허용 시 (도메인 없을 때)
    server_name _;

    # 프로젝트 루트 (Node.js 프로젝트가 설치된 디렉터리)
    root /var/www/ruahqt;

    # ─────────────────────────────────────────────
    #  /qt/  →  /var/www/ruahqt/qt/index.html
    # ─────────────────────────────────────────────
    location /qt/ {
        alias /var/www/ruahqt/qt/;

        # 폴더만 입력해도 index.html 자동 서빙
        index  index.html;
        try_files $uri $uri/ /qt/index.html;

        # 캐시: 자정 이후 교체되므로 1시간 캐시 (CDN 앞단에서 하루 캐시 권장)
        expires 1h;
        add_header Cache-Control "public, max-age=3600";

        # gzip 압축
        gzip on;
        gzip_types text/html text/css application/javascript;
    }

    # ─────────────────────────────────────────────
    #  루트(/) 접속 시 /qt/ 로 리다이렉트 (선택)
    # ─────────────────────────────────────────────
    location = / {
        return 302 /qt/;
    }

    # ─────────────────────────────────────────────
    #  보안: .json, .ejs, generate.js 직접 접근 차단
    # ─────────────────────────────────────────────
    location ~* \.(json|ejs|js|env)$ {
        deny all;
        return 404;
    }
    location /data/   { deny all; return 404; }
    location /templates/ { deny all; return 404; }

    # 에러 페이지
    error_page 404 /qt/index.html;
}
